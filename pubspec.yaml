name: postgres_crdt
description: Dart implementation of Conflict-free Replicated Data Types (CRDTs) using PostgreSQL
version: 4.0.0
homepage: https://github.com/cachapa/postgres_crdt
repository: https://github.com/cachapa/postgres_crdt
issue_tracker: https://github.com/cachapa/postgres_crdt/issues

environment:
  sdk: ^3.0.0

dependencies:
  postgres: ^3.5.6
  sql_crdt: ^4.0.0

dev_dependencies:
  lints: any
  test: any

dependency_overrides:
  sql_crdt:
    git:
      url: https://github.com/JanezStupar/sql_crdt.git
      ref: feature/postgres_related
